<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ITS 이상탐지 관제 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2126;
    --panel-2: #20262c;
    --border: #2a3138;
    --text: #e8eaed;
    --text-muted: #8b95a1;
    --normal: #2e9e5b;
    --normal-bg: rgba(46,158,91,0.12);
    --warn: #f2a93c;
    --warn-bg: rgba(242,169,60,0.12);
    --danger: #d93a3a;
    --danger-bg: rgba(217,58,58,0.14);
    --accent: #4fc3e0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 28px 32px 60px;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .topbar { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .subline { color: var(--text-muted); font-size: 13px; }
  .subline .mono { color: var(--accent); }
  #pulse { transition: opacity 0.3s ease; opacity: 0.25; color: var(--accent); }

  .hero {
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 26px;
    border: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .hero.state-normal { background: var(--normal-bg); border-color: var(--normal); }
  .hero.state-warn { background: var(--warn-bg); border-color: var(--warn); }
  .hero.state-danger { background: var(--danger-bg); border-color: var(--danger); }
  .hero-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .state-normal .hero-dot { background: var(--normal); box-shadow: 0 0 12px var(--normal); }
  .state-warn .hero-dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  .state-danger .hero-dot { background: var(--danger); box-shadow: 0 0 14px var(--danger); }
  .hero-title { font-size: 22px; font-weight: 700; }
  .hero-sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
  button {
    font-family: 'Inter', sans-serif;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  button:hover { border-color: var(--accent); }
  #demo-result { color: var(--text-muted); font-size: 13px; }

  h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; color: var(--text-muted); text-transform: uppercase; margin: 34px 0 12px; }

  .chart-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; flex: 1; min-width: 260px; max-width: 400px; }
  .chart-box h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .chart-box canvas { max-height: 220px; }

  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { background: var(--panel-2); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  td.mono, th.mono { font-family: 'IBM Plex Mono', monospace; }

  .flag { color: var(--danger); font-weight: 700; }
  .ok { color: var(--normal); font-weight: 700; }
  .fail { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>실시간 교통 이상탐지 관제</h1>
    <div class="subline">5초마다 자동 갱신 — <span id="last-updated" class="mono">대기 중</span> <span id="pulse">●</span></div>
  </div>

  <div class="hero state-normal" id="hero">
    <div class="hero-dot"></div>
    <div>
      <div class="hero-title" id="hero-title">감시 중...</div>
      <div class="hero-sub" id="hero-sub">최초 데이터 수신 대기</div>
    </div>
  </div>

  <div class="btn-row">
    <button id="demo-btn">+ 테스트 이상탐지 1건 추가 (POST)</button>
    <button id="predict-btn">+ 속도 예측 1건 실행 (POST)</button>
    <span id="demo-result"></span>
  </div>

  <h2>통계 차트</h2>
  <div class="chart-row">
    <div class="chart-box">
      <h3>차종별 검출 건수</h3>
      <canvas id="chart-cls"></canvas>
    </div>
    <div class="chart-box">
      <h3>이상 유형별 건수</h3>
      <canvas id="chart-anomaly"></canvas>
    </div>
    <div class="chart-box">
      <h3>번호판 인식 성공률</h3>
      <canvas id="chart-ocr"></canvas>
    </div>
    <div class="chart-box">
      <h3>속도 예측 — 급정거 위험 비율</h3>
      <canvas id="chart-prediction"></canvas>
    </div>
  </div>

  <h2>이상탐지 기록</h2>
  <table id="records-table">
    <thead>
      <tr><th>시간</th><th>차량 ID</th><th>이상 유형</th><th>속도(km/h)</th><th>번호판</th><th>소스</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>번호판 인식 시도 내역</h2>
  <table id="ocr-table">
    <thead>
      <tr><th>시간</th><th>인식 원문</th><th>결과 번호판</th><th>성공 여부</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>속도 예측 시도 내역</h2>
  <table id="prediction-table">
    <thead>
      <tr><th>시간</th><th>차량 ID</th><th>예측 속도(km/h)</th><th>위험 여부</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>최근 검출 결과 (원본)</h2>
  <table id="detections-table">
    <thead>
      <tr><th>시간</th><th>이미지/영상 경로</th><th>클래스</th><th>신뢰도</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const clsNames = {2: "승용차", 3: "오토바이", 5: "버스", 7: "트럭"};
    const CHART_COLORS = ["#4fc3e0", "#f2a93c", "#8a6fa8", "#2e9e5b", "#d93a3a", "#6b7684"];

    Chart.defaults.color = "#8b95a1";
    Chart.defaults.borderColor = "#2a3138";
    Chart.defaults.font.family = "'Inter', sans-serif";

    let charts = { cls: null, anomaly: null, ocr: null, prediction: null };
    let latestAnomaly = null;

    function formatTime(isoString) {
      const d = new Date(isoString);
      if (isNaN(d)) return isoString;
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} `
           + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function renderBarChart(canvasId, chartKey, labels, values, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (charts[chartKey]) charts[chartKey].destroy();
      charts[chartKey] = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: color || CHART_COLORS, borderRadius: 4 }] },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#2a3138" } },
            x: { grid: { display: false } },
          },
        },
      });
    }

    function renderDonutChart(canvasId, chartKey, labels, values) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      if (charts[chartKey]) charts[chartKey].destroy();
      charts[chartKey] = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: ["#2e9e5b", "#d93a3a"], borderColor: "#1c2126", borderWidth: 2 }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } },
      });
    }

    async function loadStats() {
      const res = await fetch('/stats');
      const data = await res.json();
      renderBarChart('chart-cls', 'cls', Object.keys(data), Object.values(data));
    }

    async function loadAnomalyStats() {
      const res = await fetch('/anomaly-stats');
      const data = await res.json();
      const labels = Object.keys(data);
      if (labels.length === 0) {
        renderBarChart('chart-anomaly', 'anomaly', ['(데이터 없음)'], [0]);
        return;
      }
      renderBarChart('chart-anomaly', 'anomaly', labels, Object.values(data), "#d93a3a");
    }

    async function loadOcrStats() {
      const res = await fetch('/ocr-stats');
      const data = await res.json();
      renderDonutChart('chart-ocr', 'ocr', ['성공', '실패'], [data.success, data.fail]);
    }

    async function loadPredictionStats() {
      const res = await fetch('/prediction-stats');
      const data = await res.json();
      renderDonutChart('chart-prediction', 'prediction', ['위험', '정상'], [data.risk, data.normal]);
    }

    async function loadPredictions() {
      const res = await fetch('/predictions?limit=20');
      const data = await res.json();
      const tbody = document.querySelector('#prediction-table tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">아직 예측 시도 기록이 없습니다</td></tr>';
        return;
      }
      data.forEach(r => {
        const row = document.createElement('tr');
        const riskLabel = r.risk_flag === 'risk'
          ? '<span class="fail">급정거 위험</span>'
          : '<span class="ok">정상</span>';
        row.innerHTML = `
          <td class="mono">${formatTime(r.predicted_at)}</td>
          <td>${r.track_id ?? '-'}</td>
          <td class="mono">${r.predicted_speed_kmh?.toFixed(1) ?? '-'}</td>
          <td>${riskLabel}</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function loadRecords() {
      const res = await fetch('/records');
      const data = await res.json();
      latestAnomaly = data.length > 0 ? data[0] : null;
      updateHero();

      const tbody = document.querySelector('#records-table tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">아직 이상탐지 기록이 없습니다</td></tr>';
        return;
      }
      data.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="mono">${formatTime(r.detected_at)}</td>
          <td>${r.track_id}</td>
          <td class="flag">${r.flags}</td>
          <td class="mono">${r.speed_kmh.toFixed(1)}</td>
          <td>${r.plate_number ?? '-'}</td>
          <td>${r.source ?? '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateHero() {
      const hero = document.querySelector('#hero');
      const title = document.querySelector('#hero-title');
      const sub = document.querySelector('#hero-sub');

      if (!latestAnomaly) {
        hero.className = 'hero state-normal';
        title.textContent = '이상 없음 — 정상 운행 중';
        sub.textContent = '아직 감지된 이상탐지 기록이 없습니다';
        return;
      }

      const elapsedSec = (Date.now() - new Date(latestAnomaly.detected_at).getTime()) / 1000;
      const timeAgo = elapsedSec < 60 ? `${Math.round(elapsedSec)}초 전` : `${Math.round(elapsedSec / 60)}분 전`;

      if (elapsedSec < 10) {
        hero.className = 'hero state-danger';
        title.textContent = `방금 감지: ${latestAnomaly.flags} (차량 ${latestAnomaly.track_id})`;
        sub.textContent = `${latestAnomaly.speed_kmh.toFixed(1)}km/h — ${timeAgo}`;
      } else {
        hero.className = 'hero state-warn';
        title.textContent = `최근 감지 이력: ${latestAnomaly.flags} (차량 ${latestAnomaly.track_id})`;
        sub.textContent = `${latestAnomaly.speed_kmh.toFixed(1)}km/h — ${timeAgo}`;
      }
    }

    async function loadDetections() {
      const res = await fetch('/detections?limit=20');
      const data = await res.json();
      const tbody = document.querySelector('#detections-table tbody');
      tbody.innerHTML = '';
      data.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="mono">${formatTime(r.detected_at)}</td>
          <td>${r.image_path}</td>
          <td>${clsNames[r.cls] ?? r.cls}</td>
          <td class="mono">${(r.conf * 100).toFixed(1)}%</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function loadOcrAttempts() {
      const res = await fetch('/ocr-attempts?limit=20');
      const data = await res.json();
      const tbody = document.querySelector('#ocr-table tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">아직 인식 시도 기록이 없습니다</td></tr>';
        return;
      }
      data.forEach(r => {
        const row = document.createElement('tr');
        const successLabel = r.success === 'success'
          ? '<span class="ok">성공</span>'
          : '<span class="fail">실패</span>';
        row.innerHTML = `
          <td class="mono">${formatTime(r.attempted_at)}</td>
          <td>${r.raw_text ?? '-'}</td>
          <td>${r.parsed_plate ?? '-'}</td>
          <td>${successLabel}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function loadAll() {
      loadStats();
      loadAnomalyStats();
      loadOcrStats();
      loadPredictionStats();
      loadRecords();
      loadOcrAttempts();
      loadPredictions();
      loadDetections();

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.querySelector('#last-updated').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      const pulse = document.querySelector('#pulse');
      pulse.style.opacity = '1';
      setTimeout(() => { pulse.style.opacity = '0.25'; }, 400);
    }

    loadAll();
    setInterval(loadAll, 5000);

    document.querySelector('#demo-btn').addEventListener('click', async () => {
      const resultSpan = document.querySelector('#demo-result');
      resultSpan.textContent = '전송 중...';
      const res = await fetch('/demo/anomaly', { method: 'POST' });
      const data = await res.json();
      resultSpan.textContent = `저장됨: track_id=${data.track_id}, ${data.flags.join(',')} (${data.speed_kmh}km/h) — 5초 안에 반영됩니다`;
      loadAll();
    });

    document.querySelector('#predict-btn').addEventListener('click', async () => {
      const resultSpan = document.querySelector('#demo-result');
      resultSpan.textContent = '예측 중...';
      const res = await fetch('/demo/prediction', { method: 'POST' });
      const data = await res.json();
      if (data.status === 'no_model') {
        resultSpan.textContent = data.message;
        return;
      }
      resultSpan.textContent = `예측 완료: 입력속도=${data.recent_speeds.join(',')} → 예측=${data.predicted_speed}km/h `
        + `(${data.risk ? '급정거 위험' : '정상'}) — 5초 안에 반영됩니다`;
      loadAll();
    });
  </script>
</body>
</html>
