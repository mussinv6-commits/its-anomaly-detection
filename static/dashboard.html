<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ITS 이상탐지 대시보드</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 32px; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  th { background: #1f4e78; color: white; }
  .flag { color: #a32d2d; font-weight: bold; }
  h1 { margin-bottom: 4px; }
  h2 { margin-top: 32px; color: #1f4e78; }
  .stat-cards { display: flex; gap: 16px; margin: 16px 0 32px; }
  .stat-card { background: #f4f6f8; border: 1px solid #e3e7ee; border-radius: 8px; padding: 16px 24px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: bold; color: #1f4e78; }
  .stat-card .label { font-size: 13px; color: #666; margin-top: 4px; }
  .ok { color: #1a7a3c; font-weight: bold; }
  .fail { color: #a32d2d; font-weight: bold; }
  #pulse { transition: opacity 0.3s ease; opacity: 0.2; }
</style>
</head>
<body>
  <h1>실시간 교통 이상탐지 현황</h1>
  <p style="color:#666">5초마다 자동 갱신됩니다 — <span id="last-updated">아직 갱신 전</span> <span id="pulse" style="color:#1a7a3c;">●</span></p>
  <button id="demo-btn" style="background:#1f4e78;color:white;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;">
    + 테스트 이상탐지 1건 추가 (POST)
  </button>
  <span id="demo-result" style="margin-left:12px;color:#666;"></span>

  <h2>차종별 검출 통계</h2>
  <div class="stat-cards" id="stat-cards"></div>

  <h2>번호판 인식률</h2>
  <div class="stat-cards" id="ocr-stat-cards"></div>

  <h2>이상탐지 기록</h2>
  <table id="records-table">
    <thead>
      <tr><th>시간</th><th>차량 ID</th><th>이상 유형</th><th>속도(km/h)</th><th>번호판</th><th>소스</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>번호판 인식 시도 내역</h2>
  <table id="ocr-table">
    <thead>
      <tr><th>시간</th><th>인식 원문</th><th>결과 번호판</th><th>성공 여부</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>최근 검출 결과 (원본)</h2>
  <table id="detections-table">
    <thead>
      <tr><th>시간</th><th>이미지/영상 경로</th><th>클래스</th><th>신뢰도</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const clsNames = {2: "승용차", 3: "오토바이", 5: "버스", 7: "트럭"};

    function formatTime(isoString) {
      // "2026-09-02T01:34:33.356588" → "2026-09-02 01:34:33"
      const d = new Date(isoString);
      if (isNaN(d)) return isoString;
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} `
           + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    async function loadStats() {
      const res = await fetch('/stats');
      const data = await res.json();
      const container = document.querySelector('#stat-cards');
      container.innerHTML = '';
      Object.entries(data).forEach(([name, count]) => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `<div class="num">${count}</div><div class="label">${name}</div>`;
        container.appendChild(card);
      });
    }

    async function loadRecords() {
      const res = await fetch('/records');
      const data = await res.json();
      const tbody = document.querySelector('#records-table tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999">아직 이상탐지 기록이 없습니다</td></tr>';
        return;
      }
      data.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${formatTime(r.detected_at)}</td>
          <td>${r.track_id}</td>
          <td class="flag">${r.flags}</td>
          <td>${r.speed_kmh.toFixed(1)}</td>
          <td>${r.plate_number ?? '-'}</td>
          <td>${r.source ?? '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function loadDetections() {
      const res = await fetch('/detections?limit=20');
      const data = await res.json();
      const tbody = document.querySelector('#detections-table tbody');
      tbody.innerHTML = '';
      data.forEach(r => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${formatTime(r.detected_at)}</td>
          <td>${r.image_path}</td>
          <td>${clsNames[r.cls] ?? r.cls}</td>
          <td>${(r.conf * 100).toFixed(1)}%</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function loadOcrStats() {
      const res = await fetch('/ocr-stats');
      const data = await res.json();
      const container = document.querySelector('#ocr-stat-cards');
      container.innerHTML = `
        <div class="stat-card"><div class="num">${data.total}</div><div class="label">전체 시도</div></div>
        <div class="stat-card"><div class="num ok">${data.success}</div><div class="label">성공</div></div>
        <div class="stat-card"><div class="num fail">${data.fail}</div><div class="label">실패</div></div>
        <div class="stat-card"><div class="num">${data.success_rate}%</div><div class="label">성공률</div></div>
      `;
    }

    async function loadOcrAttempts() {
      const res = await fetch('/ocr-attempts?limit=20');
      const data = await res.json();
      const tbody = document.querySelector('#ocr-table tbody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999">아직 인식 시도 기록이 없습니다</td></tr>';
        return;
      }
      data.forEach(r => {
        const row = document.createElement('tr');
        const successLabel = r.success === 'success'
          ? '<span class="ok">성공</span>'
          : '<span class="fail">실패</span>';
        row.innerHTML = `
          <td>${formatTime(r.attempted_at)}</td>
          <td>${r.raw_text ?? '-'}</td>
          <td>${r.parsed_plate ?? '-'}</td>
          <td>${successLabel}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function loadAll() {
      loadStats();
      loadOcrStats();
      loadRecords();
      loadOcrAttempts();
      loadDetections();

      // 실제로 몇 시 몇 분 몇 초에 갱신됐는지 화면에 표시 (갱신이 눈에 보이도록)
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.querySelector('#last-updated').textContent =
        `마지막 갱신: ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      // 갱신될 때마다 점을 잠깐 깜빡여서 "지금 막 새로고침됨"을 시각적으로 보여줌
      const pulse = document.querySelector('#pulse');
      pulse.style.opacity = '1';
      setTimeout(() => { pulse.style.opacity = '0.2'; }, 400);
    }

    loadAll();
    setInterval(loadAll, 5000); // 5초마다 갱신

    // POST 요청으로 실제 DB에 데이터가 쓰이는 걸 버튼으로 바로 확인
    document.querySelector('#demo-btn').addEventListener('click', async () => {
      const resultSpan = document.querySelector('#demo-result');
      resultSpan.textContent = '전송 중...';
      const res = await fetch('/demo/anomaly', { method: 'POST' });
      const data = await res.json();
      resultSpan.textContent = `저장됨: track_id=${data.track_id}, ${data.flags.join(',')} (${data.speed_kmh}km/h) — 5초 안에 아래 표에 나타납니다`;
      loadAll(); // 기다리지 않고 바로 한 번 갱신
    });
  </script>
</body>
</html>
